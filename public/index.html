<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e5007d">

  <title>Stop Autonomous Weapons</title>
  <meta name="description" content="Check your country's position on autonomous weapons and find out how to contact your government.">

  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <section class="intro">
      <div class="intro-content">
        

        <h1>
          STOP AUTONOMOUS WEAPONS.<br>
          EMAIL YOUR GOVERNMENT.
        </h1>

        <p class="description">
          Does your country support a legally binding treaty
          on autonomous weapons? Check its position and find
          out who to contact.
        </p>

        <div class="country-picker">
          <label for="country">FIND YOUR COUNTRY</label>
          <select id="country" name="country">
            <option value="">Select your country...</option>
          </select>
        </div>
      </div>
    </section>

    <section class="results" id="results" hidden>
      <!-- Country position and email options will appear here. -->
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
